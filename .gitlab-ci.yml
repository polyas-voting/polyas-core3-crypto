include:
  - project: 'ng/open-base'
    ref: main
    file: '/templates/gitlab.yml'

build:
  extends: .maven-build
  only:
    refs:
      - branches
  except:
    refs:
      - master
      - develop
      - trunk
      - draft

deploy:
  extends: .maven-deploy
  only:
    refs:
      - master
      - develop
      - trunk
      - draft
